[project]
name = "gatekeeping-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kalyan", email = "kalyanrambhukya54@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-jwt-extended>=4.7.4",
    "requests>=2.34.2",
]

[project.scripts]
gatekeeping-api = "gatekeeping_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "src.gatekeeping_api.index:app"